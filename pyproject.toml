[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "triply"
version = "4.0.0"
description = "Gyroid and lattice design utilities: field generation, mesh processing, STL/INP I/O, and simulation helpers."
authors = [
    { name = "Corentin Foucher", email = "corentin.foucher@empa.ch" }
]
readme = "README.md"
license = { text = "EMPA" }
requires-python = "==3.10.*"

dependencies = [
    "numpy==2.2.6",
    "numpy-stl==3.2.0",
    "scikit-image==0.25.2",
    "trimesh==4.11.1",
    "plotly==6.5.2",
    "pymeshfix==0.18.0",
    "pyvista==0.46.5",
    "meshio==5.3.5",
    "pathlib==1.0.1",
    "pandas==2.3.3",
    "SimpleITK==2.5.3",
    "pydicom==3.0.2",
    "pylibjpeg>=2.0",
    "pylibjpeg-libjpeg>=2.1",
    "tifffile==2025.5.10",
    "matplotlib==3.10.8",
    "PyQt5==5.15.11",
    "open3d==0.19.0",
    "pytest==9.1.1 ",
    "scipy==1.15.3",
]

# Optional metadata (recommended)
keywords = [
    "mesh",
    "geometry",
    "gyroid",
    "OpenCascade",
    "STL",
    "STEP",
    "visualization",
    "lattice"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
# GUI is a Streamlit front end over this library (see app/), kept out
# of the core dependencies so `pip install git+...` for headless/library
# use doesn't pull in streamlit. Install with:
#   pip install -e ".[gui]"
# sympy is used by app/components/equation_input.py to parse the GUI's custom-equation text boxes 
gui = [
    "streamlit==1.51.0",
    "sympy==1.14.0",
]

# gpu extra DISABLED (2026-09-16): uv resolves every extra when it builds
# uv.lock, and cumcubes' setup.py imports torch before torch is installed,
# so this extra made `uv run` (and launcher.bat) fail for everyone, GPU or not.
# To try it manually: pip install torch ninja, then
#   pip install --no-build-isolation git+https://github.com/lzhnb/CuMCubes.git
# Optional CUDA-accelerated marching cubes backend for mesh_tools.mesh_from_matrix()
# Kept out of core dependencies since it requires a CUDA-capable GPU.
# IT IS NOT WORKING (YET)
# gpu = [
#     "torch",
#     "ninja",
#     "cumcubes @ git+https://github.com/lzhnb/CuMCubes.git",
# ]


[project.urls]
Homepage = "https://github.com/co-foucher/triply"
Documentation = "https://github.com/co-foucher/triply"
Source = "https://github.com/co-foucher/triply"
Issues = "https://github.com/co-foucher/triply/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["triply*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
# PyQt5-Qt5 releases after 5.15.2 ship no Windows wheels. uv picks one version
# for all platforms, so without this pin Windows installs fail.
constraint-dependencies = ["pyqt5-qt5==5.15.2; sys_platform == 'win32'"]
